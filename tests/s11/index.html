<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>S11 浮卡逐字解說</title>
<style>
  :root { --bg:#e9e9eb; --ink:#1b1b1d; --card:#fff; --accent:#e8664a; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:540px; height:960px; overflow:hidden; background:var(--bg); font-family:-apple-system,"PingFang TC",sans-serif; color:var(--ink); }
  #stage { position:absolute; inset:0; background:radial-gradient(circle at 50% 38%, #fbfbfc 0, #f1f1f3 32%, var(--bg) 62%); }
  .card { position:absolute; background:var(--card); border-radius:14px; box-shadow:0 18px 40px rgba(0,0,0,.10), 0 2px 6px rgba(0,0,0,.06); will-change:transform,opacity; overflow:hidden; }
  .pill { position:absolute; left:10px; bottom:10px; background:#fff; border-radius:999px; padding:3px 10px; font-size:12px; font-weight:600; box-shadow:0 1px 3px rgba(0,0,0,.12); }
  .dark { background:#111; color:#fff; }
  #cap { position:absolute; left:0; right:0; top:700px; text-align:center; font-size:30px; letter-spacing:.02em; white-space:nowrap; }
  #cap span { display:inline-block; margin:0 3px; }
  .check { display:flex; align-items:center; gap:10px; padding:11px 16px; border-top:1px solid #f0f0f0; font-size:16px; }
  .box { width:18px; height:18px; border-radius:5px; background:#e7f5ec; color:#2f9e5b; font-size:12px; display:grid; place-items:center; }
  .hd { padding:14px 16px 8px; font-size:11px; font-weight:700; letter-spacing:.08em; color:#888; }
  .big { font-size:110px; font-weight:800; letter-spacing:-.04em; position:absolute; inset:0; display:grid; place-items:center; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="cap"></div>
<script>
// ---- 一條時間軸：旁白逐詞時間（秒） ----
const WORDS = [
  [0.2,'一個'],[0.45,'畫面'],[0.8,'**換**'],[1.05,'十一種'],[1.35,'畫風'],
  [2.6,'先'],[2.8,'出'],[3.0,'**定格**'],
  [4.3,'確認'],[4.6,'不走樣'],
  [5.6,'再'],[5.8,'**動起來**'],
  [6.9,'留言'],[7.15,'!!STYLE'],
];
const PHRASES = [[0, 5], [5, 8], [8, 10], [10, 12], [12, 14]]; // 詞索引區間，下一句開始時整句換掉
const DUR = 8.4;
const SWATCH = [['#22382d','黑板粉筆'],['#000','發光線稿'],['#f4efe4','Riso'],['#c8e0f4','扁平向量']];

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.4; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const pop = (t, t0, d = .35) => ({ k: backOut((t - t0) / d), a: easeOut((t - t0) / (d * .7)) });

function caption(t) {
  const cur = PHRASES.findLast(([s]) => WORDS[s][0] <= t + 1e-6);
  if (!cur) return '';
  return WORDS.slice(cur[0], cur[1]).map(([w0, raw]) => {
    const p = clamp((t - w0) / .15); // 還沒念到的詞也先佔位（透明），整句位置不會跳
    const accent = raw.startsWith('!!'), bold = raw.startsWith('**') || accent;
    const w = raw.replace(/^\*\*|\*\*$|^!!/g, '');
    const col = accent ? 'var(--accent)' : `rgba(27,27,29,${.35 + .65 * p})`;
    return `<span style="opacity:${p};filter:blur(${(1 - p) * 4}px);transform:translateY(${(1 - p) * 6}px);color:${col};font-weight:${bold ? 800 : 500}">${w}</span>`;
  }).join('');
}

function card(x, y, w, h, t0, t, inner, cls = '') {
  const { k, a } = pop(t, t0);
  if (a <= 0) return '';
  return `<div class="card ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;opacity:${a};transform:scale(${.92 + .08 * k}) translateY(${(1 - k) * 14}px)">${inner}</div>`;
}

function scene(t) {
  let h = '';
  if (t < 2.5) { // 四格畫風卡錯開彈出
    SWATCH.forEach(([c, n], i) => {
      const x = 60 + (i % 2) * 220, y = 200 + Math.floor(i / 2) * 150;
      h += card(x, y, 200, 130, .5 + i * .08, t, `<div style="position:absolute;inset:0;background:${c}"></div><div class="pill">${n}</div>`);
    });
    if (t > 1.05) { const n = Math.round(4 + 7 * easeOut((t - 1.05) / .6)); h += `<div class="big" style="top:-220px;opacity:${easeOut((t - 1.05) / .3)}">${n}</div>`; }
  } else if (t < 5.5) { // 清單卡逐項打勾
    const items = [['定格', 3.0], ['錨點核對', 4.0], ['不走樣', 4.6]];
    const rows = items.map(([n, ti]) => t >= ti ? `<div class="check" style="opacity:${easeOut((t - ti) / .2)}"><div class="box">✓</div>${n}</div>` : '').join('');
    h += card(90, 230, 360, 220, 2.6, t, `<div class="hd">STYLE PACK 進行中</div>${rows}`);
  } else if (t < 6.8) { // 定格卡＋黑膠囊
    h += card(70, 220, 400, 225, 5.6, t, `<div style="position:absolute;inset:0;background:#22382d"></div><svg viewBox="0 0 400 225" style="position:absolute;inset:0"><path d="M60 170H340M120 60h160v100H120z" fill="none" stroke="#f2f0e6" stroke-width="3" pathLength="1" stroke-dasharray="1" stroke-dashoffset="${1 - clamp((t - 5.8) / .8)}"/></svg>`);
    const p = easeOut((t - 6.0) / .3);
    if (p > 0) h += `<div class="pill dark" style="left:50%;bottom:auto;top:470px;transform:translateX(-50%) scale(${.9 + .1 * p});opacity:${p};font-size:14px;padding:6px 14px">逐幀用程式算出來</div>`;
  } else { // 結尾扇形疊卡
    SWATCH.forEach(([c], i) => {
      const { k, a } = pop(t, 6.8 + i * .06);
      const rot = (i - 1.5) * 7 * k;
      h += `<div class="card" style="left:150px;top:230px;width:240px;height:150px;opacity:${a};transform:rotate(${rot}deg) translateX(${(i - 1.5) * 28 * k}px)"><div style="position:absolute;inset:0;background:${c}"></div></div>`;
    });
  }
  return h;
}

window.DUR = DUR;
window.render = t => {
  document.getElementById('stage').innerHTML = scene(t);
  document.getElementById('cap').innerHTML = caption(t);
};
window.READY = true;
if (!location.hash.includes('capture')) { const s = performance.now(); (function loop() { render(((performance.now() - s) / 1000) % DUR); requestAnimationFrame(loop); })(); }
</script>
</body>
</html>
